<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fly Sapa Attendance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff); --tx:var(--tg-theme-text-color,#111);
    --hint:var(--tg-theme-hint-color,#777); --btn:var(--tg-theme-button-color,#2481cc);
    --btx:var(--tg-theme-button-text-color,#fff); --sec:var(--tg-theme-secondary-bg-color,#f2f2f2);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
       background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif}
  h1{font-size:17px;text-align:center;margin:4px 0}
  .stage{flex:1;min-height:0;border-radius:16px;background:var(--sec);overflow:hidden;position:relative;
         display:flex;align-items:center;justify-content:center}
  video,img{width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1)}
  #ph{position:absolute;text-align:center;color:var(--hint);padding:24px}
  #msg{text-align:center;color:var(--hint);font-size:14px;min-height:20px}
  .row{display:flex;gap:10px}
  button{flex:1;font-size:17px;padding:14px;border:0;border-radius:14px;background:var(--btn);color:var(--btx)}
  button.sec{background:var(--sec);color:var(--tx)}
  button:disabled{opacity:.5}
  [data-state="live"] #img, [data-state="loading"] #img, [data-state="live"] .r2, [data-state="loading"] .r2,
  [data-state="preview"] #v, [data-state="preview"] .r1, [data-state="done"] .r1, [data-state="done"] .r2,
  [data-state="loading"] .r1, [data-state="done"] #v, [data-state="error"] #v, [data-state="error"] #img,
  [data-state="error"] .r2, [data-state="error"] .r1 {display:none}
  [data-state="live"] #ph, [data-state="preview"] #ph, [data-state="done"] #ph{display:none}
</style>
</head>
<body data-state="loading">
  <h1>Fly Sapa Attendance</h1>
  <div class="stage">
    <video id="v" autoplay playsinline muted></video>
    <img id="img" alt="">
    <div id="ph">📷<br>Camera sẽ hoạt động khi cấp quyền</div>
  </div>
  <div id="msg"></div>
  <div class="row r1"><button id="shoot" disabled>📸 Chụp ảnh chấm công</button></div>
  <div class="row r2">
    <button id="retake" class="sec">Chụp lại</button>
    <button id="send">Gửi chấm công</button>
  </div>

<script>
const WEBHOOK_URL = 'https://<n8n-domain>/webhook/checkin';
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = id => document.getElementById(id);
const setState = (s, m='') => { document.body.dataset.state = s; $('msg').textContent = m; };
let stream, photo;

async function startCamera(){
  if (!tg.initData) return setState('error', 'Hãy mở trang này từ Telegram (nút Chấm công trong group).');
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    $('v').srcObject = stream; $('shoot').disabled = false;
    setState('live', 'Nhìn vào camera rồi bấm chụp');
  }catch(e){
    setState('error', 'Không mở được camera. Hãy cấp quyền camera cho Telegram trong cài đặt điện thoại.');
  }
}

$('shoot').onclick = () => {
  const v = $('v'), scale = Math.min(1, 1024 / v.videoWidth);
  const c = document.createElement('canvas');
  c.width = v.videoWidth*scale; c.height = v.videoHeight*scale;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  photo = c.toDataURL('image/jpeg', .7);
  $('img').src = photo;
  setState('preview', 'Kiểm tra ảnh rồi bấm gửi');
};

$('retake').onclick = () => setState('live', 'Nhìn vào camera rồi bấm chụp');

$('send').onclick = async () => {
  $('send').disabled = true; $('msg').textContent = 'Đang gửi...';
  try{
    const r = await fetch(WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({initData: tg.initData, image: photo})});
    const j = await r.json();
    if(!r.ok || !j.ok) throw new Error(j.error || 'Lỗi');
    stream && stream.getTracks().forEach(t => t.stop());
    setState('done', '✅ Đã chấm công lúc ' + j.time);
    setTimeout(() => tg.close(), 1500);
  }catch(e){
    $('send').disabled = false; $('msg').textContent = '❌ Gửi thất bại: ' + e.message;
  }
};

startCamera();
</script>
</body>
</html>
