```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fly Sapa Attendance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --tx: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #777);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btx: var(--tg-theme-button-text-color, #fff);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--tx);
    font-family: -apple-system, system-ui, sans-serif;
  }

  h1 {
    font-size: 17px;
    text-align: center;
    margin: 4px 0;
  }

  .modes {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 14px;
    background: var(--sec);
  }

  .modes button {
    flex: 1;
    font-size: 15px;
    padding: 10px;
    border-radius: 11px;
    background: transparent;
    color: var(--hint);
    font-weight: 600;
  }

  .modes button.active {
    background: var(--btn);
    color: var(--btx);
  }

  .stage {
    flex: 1;
    min-height: 220px;
    border-radius: 16px;
    background: var(--sec);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #ph {
    position: absolute;
    text-align: center;
    color: var(--hint);
    padding: 24px;
    line-height: 1.7;
  }

  #msg {
    text-align: center;
    color: var(--hint);
    font-size: 14px;
    min-height: 20px;
  }

  .row { display: flex; gap: 10px; }

  button {
    flex: 1;
    font-size: 17px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: var(--btn);
    color: var(--btx);
  }

  button.sec {
    background: var(--sec);
    color: var(--tx);
  }

  button:disabled { opacity: .5; }

  /* Ẩn ảnh trước khi chụp */
  [data-state="live"] #img,
  [data-state="loading"] #img,
  [data-state="error"] #img {
    display: none;
  }

  /* Khi xem trước ảnh, ẩn hướng dẫn */
  [data-state="preview"] #ph,
  [data-state="done"] #ph {
    display: none;
  }

  /* Nút chụp chỉ xuất hiện ở màn hình chờ */
  [data-state="preview"] .r1,
  [data-state="done"] .r1,
  [data-state="loading"] .r1,
  [data-state="error"] .r1 {
    display: none;
  }

  /* Nút gửi/chụp lại chỉ xuất hiện sau khi chụp */
  [data-state="live"] .r2,
  [data-state="loading"] .r2,
  [data-state="done"] .r2,
  [data-state="error"] .r2 {
    display: none;
  }

  [data-state="preview"] .modes,
  [data-state="done"] .modes,
  [data-state="error"] .modes {
    display: none;
  }

  /* Input camera không hiển thị thành nút chọn file */
  #attendance-camera {
    display: none;
  }
</style>
</head>

<body data-state="loading">

<h1>Fly Sapa Attendance</h1>

<div class="modes" id="modes">
  <button type="button" data-type="checkin" class="active">
    🟢 Check-in
  </button>
  <button type="button" data-type="checkout">
    🔴 Check-out
  </button>
</div>

<div class="stage">
  <img id="img" alt="Ảnh chấm công">

  <div id="ph">
    📷<br>
    Nhấn nút bên dưới để mở camera<br>
    Chụp ảnh trực tiếp để chấm công
  </div>
</div>

<div id="msg"></div>

<div class="row r1">
  <button id="shoot" type="button">📸 Chụp ảnh check-in</button>
</div>

<div class="row r2">
  <button id="retake" type="button" class="sec">Chụp lại</button>
  <button id="send" type="button">Gửi check-in</button>
</div>

<input
  id="attendance-camera"
  type="file"
  accept="image/*"
  capture="user"
/>

<script>
const WEBHOOK_URL =
  'https://flysapa.app.n8n.cloud/webhook/checkin';

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const $ = id => document.getElementById(id);

const LABEL = {
  checkin: 'check-in',
  checkout: 'check-out'
};

let photo = null;
let type = 'checkin';
let busy = false;

const setState = (state, message = '') => {
  document.body.dataset.state = state;
  $('msg').textContent = message;
};

const liveMsg = () =>
  `Nhấn Chụp ảnh để mở camera (${LABEL[type]})`;

function setType(t) {
  type = t;

  document.querySelectorAll('#modes button').forEach(button => {
    button.classList.toggle('active', button.dataset.type === t);
  });

  $('shoot').textContent = '📸 Chụp ảnh ' + LABEL[t];
  $('send').textContent = 'Gửi ' + LABEL[t];

  if (document.body.dataset.state === 'live') {
    $('msg').textContent = liveMsg();
  }
}

document.querySelectorAll('#modes button').forEach(button => {
  button.onclick = () => setType(button.dataset.type);
});

// Hỗ trợ mở link với ?type=checkout hoặc start_param của Telegram.
const queryType =
  new URLSearchParams(location.search).get('type') ||
  tg.initDataUnsafe?.start_param;

if (queryType === 'checkout' || queryType === 'checkin') {
  setType(queryType);
}

function showLive() {
  photo = null;
  $('img').removeAttribute('src');
  $('shoot').disabled = false;
  setState('live', liveMsg());
}

// Mở camera của điện thoại thông qua giao diện hệ điều hành.
$('shoot').onclick = () => {
  if (busy) return;

  if (!tg.initData) {
    setState(
      'error',
      'Hãy mở Mini App từ Telegram để chấm công.'
    );
    return;
  }

  const input = $('attendance-camera');

  // Dùng cùng cấu hình chụp ảnh trên iPhone và Android
  input.setAttribute('capture', 'user');

  // Xóa ảnh cũ để có thể chụp ảnh mới
  input.value = '';

  input.click();
};

$('attendance-camera').onchange = async event => {
  const file = event.target.files?.[0];

  // Người dùng đóng camera hoặc hủy chụp.
  if (!file) return;

  try {
    if (!file.type.startsWith('image/') || file.size === 0) {
      throw new Error('Ảnh không hợp lệ. Vui lòng chụp lại.');
    }

    $('shoot').disabled = true;
    setState('loading', 'Đang xử lý ảnh...');

    // Đọc ảnh vừa chụp.
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        if (
          typeof reader.result !== 'string' ||
          !reader.result.startsWith('data:image/')
        ) {
          reject(new Error('Không đọc được ảnh.'));
          return;
        }

        resolve(reader.result);
      };

      reader.onerror = () =>
        reject(new Error('Không đọc được ảnh. Vui lòng chụp lại.'));

      reader.readAsDataURL(file);
    });

    // Chuẩn hóa ảnh thành JPEG và giới hạn cạnh dài tối đa 1024 px.
    // Nhờ vậy webhook tiếp tục nhận ảnh theo định dạng JPEG như trước.
    const image = await new Promise((resolve, reject) => {
      const img = new Image();

      img.onload = () => resolve(img);
      img.onerror = () =>
        reject(new Error(
          'Không xử lý được định dạng ảnh này. Hãy thử chụp lại.'
        ));

      img.src = dataUrl;
    });

    if (!image.naturalWidth || !image.naturalHeight) {
      throw new Error('Ảnh không có kích thước hợp lệ.');
    }

    const scale = Math.min(
      1,
      1024 / Math.max(image.naturalWidth, image.naturalHeight)
    );

    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

    const context = canvas.getContext('2d');

    if (!context) {
      throw new Error('Không thể xử lý ảnh trên thiết bị này.');
    }

    context.drawImage(image, 0, 0, canvas.width, canvas.height);

    photo = canvas.toDataURL('image/jpeg', 0.8);

    if (
      !photo.startsWith('data:image/jpeg;base64,') ||
      photo.length < 1000
    ) {
      photo = null;
      throw new Error('Ảnh tạo ra không hợp lệ. Vui lòng chụp lại.');
    }

    $('img').src = photo;

    setState(
      'preview',
      `Kiểm tra ảnh rồi bấm gửi ${LABEL[type]}`
    );
  } catch (error) {
    photo = null;
    $('shoot').disabled = false;
    setState('live', '❌ ' + error.message);
  } finally {
    // Cho phép chụp ảnh mới trong lần tiếp theo.
    $('attendance-camera').value = '';
  }
};

$('retake').onclick = () => {
  if (busy) return;
  showLive();
};

$('send').onclick = async () => {
  if (busy) return;

  if (!photo || !photo.startsWith('data:image/jpeg;base64,')) {
    setState('live', 'Vui lòng chụp ảnh hợp lệ trước khi gửi.');
    return;
  }

  busy = true;
  $('send').disabled = true;
  $('retake').disabled = true;

  setState('preview', 'Đang gửi dữ liệu chấm công...');

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        initData: tg.initData,
        image: photo,
        type: type
      })
    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(result.error || 'Gửi chấm công thất bại.');
    }

    setState(
      'done',
      `✅ Đã ${LABEL[type]} lúc ${
        result.time ||
        new Date().toLocaleTimeString('vi-VN', {
          hour: '2-digit',
          minute: '2-digit',
          timeZone: 'Asia/Ho_Chi_Minh'
        })
      }`
    );

    setTimeout(() => tg.close(), 1500);
  } catch (error) {
    busy = false;
    $('send').disabled = false;
    $('retake').disabled = false;

    setState(
      'preview',
      '❌ Gửi thất bại: ' + error.message
    );
  }
};

// Không cần bật camera ngay khi mở Mini App.
if (!tg.initData) {
  setState('error', 'Hãy mở Mini App từ Telegram để chấm công.');
} else {
  showLive();
}
</script>
</body>
</html>
