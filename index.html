<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<title>Fly Sapa Attendance</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#777);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btx:var(--tg-theme-button-text-color,#fff);
  --sec:var(--tg-theme-secondary-bg-color,#f2f2f2);
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
  margin:0;
}

body{
  display:flex;
  flex-direction:column;
  gap:12px;

  padding:
    12px
    16px
    calc(12px + env(safe-area-inset-bottom));

  background:var(--bg);
  color:var(--tx);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

h1{
  font-size:17px;
  text-align:center;
  margin:4px 0;
}

/* =========================
   CHECK-IN / CHECK-OUT
========================= */

.modes{
  display:flex;
  gap:4px;
  padding:4px;
  border-radius:14px;
  background:var(--sec);
}

.modes button{
  flex:1;
  font-size:15px;
  padding:10px;
  border-radius:11px;
  background:transparent;
  color:var(--hint);
  font-weight:600;
}

.modes button.active{
  background:var(--btn);
  color:var(--btx);
}

/* =========================
   CAMERA AREA
========================= */

.stage{
  flex:1;
  min-height:220px;

  border-radius:16px;
  background:var(--sec);

  overflow:hidden;
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;
}

#img,
#android-camera{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Android camera */

#android-camera{
  display:none;
}

/* Khi Android camera đang hoạt động */

.stage.android-camera-active #android-camera{
  display:block;
}

.stage.android-camera-active #img,
.stage.android-camera-active #ph{
  display:none;
}

/* Camera trước Android: mirror */

.stage.android-front #android-camera{
  transform:scaleX(-1);
}

/* Camera sau Android */

.stage.android-back #android-camera{
  transform:none;
}

#ph{
  position:absolute;

  text-align:center;
  color:var(--hint);

  padding:24px;

  line-height:1.7;
}

#msg{
  text-align:center;
  color:var(--hint);

  font-size:14px;
  min-height:20px;

  overflow-wrap:anywhere;

  white-space:pre-line;
}

/* =========================
   BUTTONS
========================= */

.row{
  display:flex;
  gap:10px;
}

button{
  flex:1;

  font-size:17px;
  padding:14px;

  border:0;
  border-radius:14px;

  background:var(--btn);
  color:var(--btx);
}

button.sec{
  background:var(--sec);
  color:var(--tx);
}

button:disabled{
  opacity:.5;
}

/* =========================
   CAMERA SWITCH BUTTON
========================= */

#switch-camera{
  flex:0 0 auto;
  width:58px;

  font-size:20px;
  padding:14px 8px;
}

/* =========================
   IPHONE CAMERA INPUT
========================= */

#attendance-camera{
  display:none;
}

/* =========================
   STATE: LIVE
========================= */

[data-state="live"] #img,
[data-state="loading"] #img,
[data-state="error"] #img{
  display:none;
}

/* =========================
   STATE: PREVIEW
========================= */

[data-state="preview"] #ph,
[data-state="done"] #ph{
  display:none;
}

[data-state="preview"] #android-camera,
[data-state="done"] #android-camera,
[data-state="error"] #android-camera{
  display:none;
}

/* =========================
   BUTTON VISIBILITY
========================= */

[data-state="live"] .r2,
[data-state="loading"] .r1,
[data-state="loading"] .r2,
[data-state="preview"] .r1,
[data-state="done"] .r1,
[data-state="done"] .r2,
[data-state="error"] .r1,
[data-state="error"] .r2{
  display:none;
}

/* Hide modes after photo */

[data-state="preview"] .modes,
[data-state="done"] .modes,
[data-state="error"] .modes{
  display:none;
}

</style>
</head>


<body data-state="loading">

<h1>Fly Sapa Attendance</h1>


<!-- =========================
     CHECK-IN / CHECK-OUT
========================= -->

<div class="modes" id="modes">

  <button
    type="button"
    data-type="checkin"
    class="active"
  >
    🟢 Check-in
  </button>

  <button
    type="button"
    data-type="checkout"
  >
    🔴 Check-out
  </button>

</div>


<!-- =========================
     CAMERA
========================= -->

<div class="stage" id="stage">

  <video
    id="android-camera"
    autoplay
    playsinline
    muted
  ></video>

  <img
    id="img"
    alt="Ảnh chấm công"
  >

  <div id="ph">
    📷<br>
    Nhấn nút bên dưới để chụp ảnh chấm công
  </div>

</div>


<div id="msg"></div>


<!-- =========================
     CAMERA CONTROL
========================= -->

<div class="row r1">

  <button
    id="switch-camera"
    type="button"
    class="sec"
    aria-label="Đổi camera"
  >
    🔄
  </button>

  <button
    id="shoot"
    type="button"
  >
    📸 Chụp ảnh check-in
  </button>

</div>


<!-- =========================
     PREVIEW CONTROL
========================= -->

<div class="row r2">

  <button
    id="retake"
    type="button"
    class="sec"
  >
    Chụp lại
  </button>

  <button
    id="send"
    type="button"
  >
    Gửi check-in
  </button>

</div>


<!-- =========================
     IPHONE CAMERA INPUT
========================= -->

<input
  id="attendance-camera"
  type="file"
  accept="image/*"
  capture="user"
/>


<script>

/* ============================================================
   CONFIG
============================================================ */

const WEBHOOK_URL =
  'https://flysapa.app.n8n.cloud/webhook/checkin';


/* ============================================================
   TELEGRAM
============================================================ */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* ============================================================
   HELPERS
============================================================ */

const $ = id =>
  document.getElementById(id);


const LABEL = {
  checkin: 'check-in',
  checkout: 'check-out'
};


/* ============================================================
   DEVICE
============================================================ */

const isAndroid =
  /Android/i.test(navigator.userAgent);


/* ============================================================
   STATE
============================================================ */

let photo = null;

let type = 'checkin';

let busy = false;

let androidStream = null;

let androidCameraReady = false;

let cameraStarting = false;


/*
  user        = camera trước
  environment = camera sau
*/

let cameraFacing = 'user';


/* ============================================================
   STATE UI
============================================================ */

const setState = (
  state,
  message = ''
) => {

  document.body.dataset.state = state;

  $('msg').textContent = message;

};


/* ============================================================
   UPDATE CAMERA BUTTON
============================================================ */

function updateCameraUI(){

  const switchButton =
    $('switch-camera');

  if(cameraFacing === 'user'){

    switchButton.textContent = '🔄';

    switchButton.setAttribute(
      'aria-label',
      'Đổi sang camera sau'
    );

  }else{

    switchButton.textContent = '🔄';

    switchButton.setAttribute(
      'aria-label',
      'Đổi sang camera trước'
    );

  }

}


/* ============================================================
   UPDATE SHOOT BUTTON
============================================================ */

function updateShootLabel(){

  if(
    isAndroid &&
    !androidCameraReady
  ){

    $('shoot').textContent =
      '📷 Mở camera ' + LABEL[type];

  }else{

    $('shoot').textContent =
      '📸 Chụp ảnh ' + LABEL[type];

  }

}


/* ============================================================
   SET TYPE
============================================================ */

function setType(newType){

  type = newType;

  document
    .querySelectorAll('#modes button')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type === newType
      );

    });


  updateShootLabel();


  $('send').textContent =
    'Gửi ' + LABEL[type];


  if(
    document.body.dataset.state === 'live'
  ){

    $('msg').textContent =
      isAndroid && !androidCameraReady

        ? 'Nhấn Mở camera để chụp ảnh ' +
          LABEL[type]

        : 'Nhìn vào camera rồi chụp ảnh ' +
          LABEL[type];

  }

}


/* ============================================================
   CHECK-IN / CHECK-OUT BUTTON
============================================================ */

document
  .querySelectorAll('#modes button')
  .forEach(button => {

    button.onclick = () => {

      if(busy) return;

      setType(
        button.dataset.type
      );

    };

  });


/* ============================================================
   START PARAM
============================================================ */

/*
  Link ngoài Telegram: ?t=<token riêng của nhân viên>
  Dùng cho người không vào được Telegram. n8n tra token trong
  bảng Employees để biết user_id/tên; ảnh vẫn được bot đăng vào nhóm.
*/

const staffToken =
  new URLSearchParams(
    location.search
  ).get('t') || '';

const hasAuth =
  !!(tg.initData || staffToken);


const queryType =

  new URLSearchParams(
    location.search
  ).get('type')

  ||

  tg.initDataUnsafe?.start_param;


if(
  queryType === 'checkout' ||
  queryType === 'checkin'
){

  setType(queryType);

}


/* ============================================================
   STOP ANDROID CAMERA
============================================================ */

function stopAndroidCamera(){

  if(androidStream){

    androidStream
      .getTracks()
      .forEach(track => track.stop());

  }


  androidStream = null;

  androidCameraReady = false;

  cameraStarting = false;


  const video =
    $('android-camera');


  video.pause();

  video.srcObject = null;


  $('stage')
    .classList.remove(
      'android-camera-active',
      'android-front',
      'android-back'
    );


  updateShootLabel();

}


/* ============================================================
   WAIT FOR VIDEO
============================================================ */

function waitForVideo(
  video,
  timeoutMs = 10000
){

  return new Promise(
    (resolve, reject) => {

      let finished = false;

      let timer;


      const cleanup = () => {

        clearTimeout(timer);

        video.removeEventListener(
          'loadedmetadata',
          check
        );

        video.removeEventListener(
          'loadeddata',
          check
        );

        video.removeEventListener(
          'canplay',
          check
        );

      };


      const finish = error => {

        if(finished) return;

        finished = true;

        cleanup();


        if(error){

          reject(error);

        }else{

          resolve();

        }

      };


      const check = () => {

        if(
          video.videoWidth > 0 &&
          video.videoHeight > 0 &&
          video.readyState >= 2
        ){

          finish();

        }

      };


      video.addEventListener(
        'loadedmetadata',
        check
      );

      video.addEventListener(
        'loadeddata',
        check
      );

      video.addEventListener(
        'canplay',
        check
      );


      timer = setTimeout(
        () => {

          finish(
            new Error(
              'Camera khởi động quá lâu. Hãy thử lại.'
            )
          );

        },
        timeoutMs
      );


      check();

    }
  );

}


/* ============================================================
   OPEN ANDROID CAMERA
============================================================ */

async function openAndroidCamera(){

  if(
    cameraStarting ||
    busy
  ){

    return;

  }


  cameraStarting = true;

  $('shoot').disabled = true;


  setState(
    'loading',
    'Đang mở camera...'
  );


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'Telegram không hỗ trợ camera trực tiếp trên thiết bị này.'
      );

    }


    /*
      Nếu đang có camera,
      dừng trước khi đổi camera.
    */

    if(androidStream){

      androidStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      androidStream = null;

    }


    /*
      Yêu cầu camera trước hoặc sau.
    */

    androidStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              exact: cameraFacing
            }

          },

          audio: false

        });


    const video =
      $('android-camera');


    video.srcObject =
      androidStream;


    /*
      Hiển thị camera.
    */

    $('stage')
      .classList.add(
        'android-camera-active'
      );


    /*
      Camera trước mirror.
    */

    $('stage')
      .classList.toggle(
        'android-front',
        cameraFacing === 'user'
      );


    $('stage')
      .classList.toggle(
        'android-back',
        cameraFacing === 'environment'
      );


    await video.play();


    await waitForVideo(video);


    androidCameraReady = true;

    cameraStarting = false;


    $('shoot').disabled = false;


    updateShootLabel();


    setState(
      'live',

      cameraFacing === 'user'

        ? 'Camera trước đã sẵn sàng.'

        : 'Camera sau đã sẵn sàng.'

    );


  }catch(error){

    stopAndroidCamera();


    $('shoot').disabled = false;


    setState(
      'live',
      '❌ Không mở được camera: ' +
      error.message +
      ' Hãy kiểm tra quyền camera của Telegram.'
    );

  }

}


/* ============================================================
   NORMALIZE IMAGE
============================================================ */

async function normalizeImage(
  dataUrl
){

  const image =
    await new Promise(
      (resolve, reject) => {

        const img =
          new Image();


        img.onload = () => {

          if(
            !img.naturalWidth ||
            !img.naturalHeight
          ){

            reject(
              new Error(
                'Ảnh không có kích thước hợp lệ.'
              )
            );

          }else{

            resolve(img);

          }

        };


        img.onerror = () => {

          reject(
            new Error(
              'Không đọc được ảnh. Hãy chụp lại bằng camera.'
            )
          );

        };


        img.src = dataUrl;

      }
    );


  /*
    Giới hạn cạnh dài 1024px.
  */

  const scale =
    Math.min(
      1,
      1024 /
      Math.max(
        image.naturalWidth,
        image.naturalHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        image.naturalWidth * scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        image.naturalHeight * scale
      )
    );


  const context =
    canvas.getContext('2d');


  if(!context){

    throw new Error(
      'Không thể xử lý ảnh trên thiết bị này.'
    );

  }


  context.drawImage(
    image,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const jpeg =
    canvas.toDataURL(
      'image/jpeg',
      0.8
    );


  /*
    Chặn data:, ảnh rỗng
  */

  if(
    !jpeg.startsWith(
      'data:image/jpeg;base64,'
    ) ||
    jpeg.length < 1000
  ){

    throw new Error(
      'Ảnh không hợp lệ. Vui lòng chụp lại.'
    );

  }


  return jpeg;

}


/* ============================================================
   IPHONE / SYSTEM CAMERA
============================================================ */

$('attendance-camera').onchange =
  async event => {

    const file =
      event.target.files?.[0];


    /*
      Người dùng bấm cancel.
    */

    if(!file){

      return;

    }


    try{

      if(
        !file.type.startsWith(
          'image/'
        ) ||
        file.size === 0
      ){

        throw new Error(
          'Ảnh không hợp lệ. Vui lòng chụp lại.'
        );

      }


      $('shoot').disabled = true;


      setState(
        'loading',
        'Đang xử lý ảnh...'
      );


      /*
        Đọc ảnh.
      */

      const dataUrl =
        await new Promise(
          (resolve, reject) => {

            const reader =
              new FileReader();


            reader.onload = () => {

              if(
                typeof reader.result !==
                'string' ||

                !reader.result.startsWith(
                  'data:image/'
                )
              ){

                reject(
                  new Error(
                    'Không đọc được ảnh.'
                  )
                );

                return;

              }


              resolve(
                reader.result
              );

            };


            reader.onerror = () => {

              reject(
                new Error(
                  'Không đọc được ảnh. Vui lòng thử lại.'
                )
              );

            };


            reader.readAsDataURL(
              file
            );

          }
        );


      /*
        Chuẩn hóa thành JPEG.
      */

      photo =
        await normalizeImage(
          dataUrl
        );


      $('img').src =
        photo;


      setState(
        'preview',
        `Kiểm tra ảnh rồi bấm gửi ${LABEL[type]}`
      );


    }catch(error){

      photo = null;

      $('shoot').disabled = false;


      setState(
        'live',
        '❌ ' + error.message
      );


    }finally{

      /*
        Cho phép chụp lại.
      */

      event.target.value = '';

    }

  };


/* ============================================================
   SWITCH CAMERA
============================================================ */

$('switch-camera').onclick =
  async () => {

    if(
      busy ||
      cameraStarting
    ){

      return;

    }


    /*
      Đổi trạng thái:
      trước <-> sau
    */

    cameraFacing =
      cameraFacing === 'user'
        ? 'environment'
        : 'user';


    updateCameraUI();


    /* ==========================
       ANDROID
    ========================== */

    if(isAndroid){

      /*
        Nếu camera đang mở,
        mở lại với camera mới.
      */

      if(androidCameraReady){

        await openAndroidCamera();

      }else{

        await openAndroidCamera();

      }

      return;

    }


    /* ==========================
       IPHONE
    ========================== */

    /*
      iPhone dùng camera hệ thống.
      Khi bấm Chụp ảnh tiếp theo,
      capture sẽ dùng camera mới.
    */

    setState(
      'live',

      cameraFacing === 'user'

        ? 'Đã chọn camera trước.'

        : 'Đã chọn camera sau.'
    );

  };


/* ============================================================
   SHOOT
============================================================ */

$('shoot').onclick =
  async () => {

    if(
      busy ||
      cameraStarting
    ){

      return;

    }


    if(!hasAuth){

      setState(
        'error',
        'Hãy mở bằng link chấm công của bạn (Telegram hoặc link riêng).'
      );

      return;

    }


    /* ==========================
       ANDROID
    ========================== */

    if(isAndroid){

      /*
        Chưa mở camera:
        mở camera trước/sau.
      */

      if(!androidCameraReady){

        await openAndroidCamera();

        return;

      }


      try{

        const video =
          $('android-camera');


        if(
          !video.videoWidth ||
          !video.videoHeight
        ){

          throw new Error(
            'Camera chưa có hình ảnh. Hãy thử lại.'
          );

        }


        $('shoot').disabled = true;


        /*
          Resize ảnh.
        */

        const scale =
          Math.min(
            1,
            1024 /
            Math.max(
              video.videoWidth,
              video.videoHeight
            )
          );


        const canvas =
          document.createElement(
            'canvas'
          );


        canvas.width =
          Math.max(
            1,
            Math.round(
              video.videoWidth * scale
            )
          );


        canvas.height =
          Math.max(
            1,
            Math.round(
              video.videoHeight * scale
            )
          );


        const context =
          canvas.getContext('2d');


        if(!context){

          throw new Error(
            'Không thể xử lý ảnh.'
          );

        }


        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const captured =
          canvas.toDataURL(
            'image/jpeg',
            0.8
          );


        /*
          Chặn ảnh rỗng.
        */

        if(
          !captured.startsWith(
            'data:image/jpeg;base64,'
          ) ||
          captured.length < 1000
        ){

          throw new Error(
            'Ảnh không hợp lệ. Vui lòng chụp lại.'
          );

        }


        photo =
          captured;


        $('img').src =
          photo;


        /*
          Dừng camera sau khi chụp.
        */

        stopAndroidCamera();


        setState(
          'preview',
          `Kiểm tra ảnh rồi bấm gửi ${LABEL[type]}`
        );


      }catch(error){

        $('shoot').disabled =
          false;


        setState(
          'live',
          '❌ ' + error.message
        );

      }


      return;

    }


    /* ==========================
       IPHONE
    ========================== */

    const input =
      $('attendance-camera');


    /*
      Camera trước hoặc sau
      tùy trạng thái hiện tại.
    */

    input.setAttribute(
      'capture',
      cameraFacing
    );


    input.value = '';


    /*
      Mở camera hệ thống iPhone.
    */

    input.click();

  };


/* ============================================================
   RETAKE
============================================================ */

$('retake').onclick =
  () => {

    if(busy) return;


    photo = null;


    $('img')
      .removeAttribute('src');


    stopAndroidCamera();


    $('send').disabled =
      false;


    $('retake').disabled =
      false;


    $('shoot').disabled =
      false;


    showLive(
      isAndroid

        ? 'Nhấn Chụp ảnh để mở camera.'

        : 'Nhấn Chụp ảnh để chụp lại.'
    );

  };


/* ============================================================
   SHOW LIVE
============================================================ */

function showLive(
  message
){

  $('img')
    .removeAttribute('src');


  $('shoot').disabled =
    false;


  updateShootLabel();


  setState(
    'live',
    message ||
    'Sẵn sàng chấm công.'
  );

}


/* ============================================================
   SEND
============================================================ */

$('send').onclick =
  async () => {

    if(busy) return;


    /*
      Không cho gửi ảnh rỗng.
    */

    if(
      !photo ||

      !photo.startsWith(
        'data:image/jpeg;base64,'
      ) ||

      photo.length < 1000
    ){

      setState(
        'live',
        'Vui lòng chụp ảnh hợp lệ trước khi gửi.'
      );

      return;

    }


    busy = true;


    $('send').disabled =
      true;

    $('retake').disabled =
      true;


    setState(
      'preview',
      'Đang gửi dữ liệu chấm công...'
    );


    try{

      const response =
        await fetch(
          WEBHOOK_URL,
          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:JSON.stringify({

              initData:
                tg.initData || '',

              token:
                staffToken,

              image:
                photo,

              type:
                type

            })

          }
        );


      const result =
        await response.json();


      if(
        !response.ok ||
        !result.ok
      ){

        throw new Error(
          result.error ||
          'Gửi chấm công thất bại.'
        );

      }


      /*
        Đảm bảo camera đã dừng.
      */

      stopAndroidCamera();


      /*
        Server trả về result.message (đúng giờ / vào sau giờ /
        ra sớm / đủ công / OT chờ duyệt) theo spec 23/10/2026.
        Nếu workflow cũ chưa trả message thì dùng câu mặc định.
      */

      const fallbackTime =
        result.time ||

        new Date()
          .toLocaleTimeString(
            'vi-VN',
            {
              hour:'2-digit',
              minute:'2-digit',
              timeZone:
                'Asia/Ho_Chi_Minh'
            }
          );

      const doneMessage =
        result.message ||
        `✅ Đã ${LABEL[type]} lúc ${fallbackTime}`;


      setState(
        'done',
        `${doneMessage}\n(${fallbackTime})`
      );


      /*
        Giữ màn hình lâu hơn để nhân viên kịp đọc kết quả.
      */

      setTimeout(
        () => tg.close(),
        result.message ? 6000 : 1500
      );


    }catch(error){

      busy = false;


      $('send').disabled =
        false;

      $('retake').disabled =
        false;


      setState(
        'preview',

        '❌ Gửi thất bại: ' +
        error.message
      );

    }

  };


/* ============================================================
   INITIALIZE
============================================================ */

updateCameraUI();

updateShootLabel();


if(!hasAuth){

  setState(
    'error',
    'Hãy mở bằng link chấm công của bạn (Telegram hoặc link riêng).'
  );

}else{

  showLive(
    isAndroid

      ? 'Nhấn Chụp ảnh để mở camera.'

      : 'Nhấn Chụp ảnh để bắt đầu chấm công.'
  );

}


/* ============================================================
   STOP CAMERA WHEN MINI APP HIDDEN
============================================================ */

document.addEventListener(
  'visibilitychange',
  () => {

    if(
      document.hidden &&
      androidStream
    ){

      stopAndroidCamera();

    }

  }
);

</script>
