<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fly Sapa Attendance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --tx: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #777);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btx: var(--tg-theme-button-text-color, #fff);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--tx);
    font-family: -apple-system, system-ui, sans-serif;
  }

  h1 {
    font-size: 17px;
    text-align: center;
    margin: 4px 0;
  }

  .modes {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 14px;
    background: var(--sec);
  }

  .modes button {
    flex: 1;
    font-size: 15px;
    padding: 10px;
    border-radius: 11px;
    background: transparent;
    color: var(--hint);
    font-weight: 600;
  }

  .modes button.active {
    background: var(--btn);
    color: var(--btx);
  }

  .stage {
    flex: 1;
    min-height: 220px;
    border-radius: 16px;
    background: var(--sec);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #img, #android-camera {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #android-camera {
    display: none;
  }

  .stage.android-camera-active #android-camera {
    display: block;
  }

  .stage.android-camera-active #img,
  .stage.android-camera-active #ph {
    display: none;
  }

  #ph {
    position: absolute;
    text-align: center;
    color: var(--hint);
    padding: 24px;
    line-height: 1.7;
  }

  #msg {
    text-align: center;
    color: var(--hint);
    font-size: 14px;
    min-height: 20px;
    overflow-wrap: anywhere;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  button {
    flex: 1;
    font-size: 17px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: var(--btn);
    color: var(--btx);
  }

  button.sec {
    background: var(--sec);
    color: var(--tx);
  }

  button:disabled {
    opacity: .5;
  }

  /* Camera input chỉ được gọi bằng nút Chụp ảnh */
  #attendance-camera {
    display: none;
  }

  /* Trạng thái chờ chụp */
  [data-state="live"] #img,
  [data-state="loading"] #img,
  [data-state="error"] #img {
    display: none;
  }

  /* Trạng thái xem trước */
  [data-state="preview"] #ph,
  [data-state="done"] #ph {
    display: none;
  }

  [data-state="preview"] #android-camera,
  [data-state="done"] #android-camera,
  [data-state="error"] #android-camera {
    display: none;
  }

  /* Hiện/ẩn nút theo trạng thái */
  [data-state="live"] .r2,
  [data-state="loading"] .r1,
  [data-state="loading"] .r2,
  [data-state="preview"] .r1,
  [data-state="done"] .r1,
  [data-state="done"] .r2,
  [data-state="error"] .r1,
  [data-state="error"] .r2 {
    display: none;
  }

  [data-state="preview"] .modes,
  [data-state="done"] .modes,
  [data-state="error"] .modes {
    display: none;
  }
</style>
</head>

<body data-state="loading">

<h1>Fly Sapa Attendance</h1>

<div class="modes" id="modes">
  <button type="button" data-type="checkin" class="active">
    🟢 Check-in
  </button>
  <button type="button" data-type="checkout">
    🔴 Check-out
  </button>
</div>

<div class="stage" id="stage">
  <video id="android-camera" autoplay playsinline muted></video>
  <img id="img" alt="Ảnh chấm công">

  <div id="ph">
    📷<br>
    Nhấn nút bên dưới để chụp ảnh chấm công
  </div>
</div>

<div id="msg"></div>

<div class="row r1">
  <button id="shoot" type="button">📸 Chụp ảnh check-in</button>
</div>

<div class="row r2">
  <button id="retake" type="button" class="sec">Chụp lại</button>
  <button id="send" type="button">Gửi check-in</button>
</div>

<input
  id="attendance-camera"
  type="file"
  accept="image/*"
  capture="user"
/>

<script>
const WEBHOOK_URL =
  'https://flysapa.app.n8n.cloud/webhook/checkin';

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const $ = id => document.getElementById(id);

const LABEL = {
  checkin: 'check-in',
  checkout: 'check-out'
};

const isAndroid = /Android/i.test(navigator.userAgent);

let photo = null;
let type = 'checkin';
let busy = false;
let androidStream = null;
let androidCameraReady = false;
let cameraStarting = false;

const setState = (state, message = '') => {
  document.body.dataset.state = state;
  $('msg').textContent = message;
};

function updateShootLabel() {
  if (isAndroid && !androidCameraReady) {
    $('shoot').textContent = '📷 Mở camera ' + LABEL[type];
  } else {
    $('shoot').textContent = '📸 Chụp ảnh ' + LABEL[type];
  }
}

function showLive(message) {
  $('img').removeAttribute('src');
  $('shoot').disabled = false;
  updateShootLabel();
  setState('live', message || 'Sẵn sàng chấm công.');
}

function setType(newType) {
  type = newType;

  document.querySelectorAll('#modes button').forEach(button => {
    button.classList.toggle(
      'active',
      button.dataset.type === newType
    );
  });

  updateShootLabel();
  $('send').textContent = 'Gửi ' + LABEL[type];

  if (document.body.dataset.state === 'live') {
    $('msg').textContent = isAndroid && !androidCameraReady
      ? 'Nhấn mở camera để chụp ảnh ' + LABEL[type]
      : 'Nhìn vào camera rồi chụp ảnh ' + LABEL[type];
  }
}

document.querySelectorAll('#modes button').forEach(button => {
  button.onclick = () => {
    if (busy) return;
    setType(button.dataset.type);
  };
});

// Hỗ trợ ?type=checkout hoặc start_param của Telegram.
const queryType =
  new URLSearchParams(location.search).get('type') ||
  tg.initDataUnsafe?.start_param;

if (queryType === 'checkout' || queryType === 'checkin') {
  setType(queryType);
}

// Dừng camera Android và giải phóng tài nguyên.
function stopAndroidCamera() {
  if (androidStream) {
    androidStream.getTracks().forEach(track => track.stop());
  }

  androidStream = null;
  androidCameraReady = false;
  cameraStarting = false;

  const video = $('android-camera');
  video.pause();
  video.srcObject = null;

  $('stage').classList.remove('android-camera-active');
  updateShootLabel();
}

// Chờ video thực sự có kích thước khung hình.
function waitForVideo(video, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    let finished = false;
    let timer;

    const cleanup = () => {
      clearTimeout(timer);
      video.removeEventListener('loadedmetadata', check);
      video.removeEventListener('loadeddata', check);
      video.removeEventListener('canplay', check);
    };

    const finish = (error) => {
      if (finished) return;
      finished = true;
      cleanup();

      if (error) reject(error);
      else resolve();
    };

    const check = () => {
      if (
        video.videoWidth > 0 &&
        video.videoHeight > 0 &&
        video.readyState >= 2
      ) {
        finish();
      }
    };

    video.addEventListener('loadedmetadata', check);
    video.addEventListener('loadeddata', check);
    video.addEventListener('canplay', check);

    timer = setTimeout(() => {
      finish(new Error('Camera khởi động quá lâu. Hãy thử lại.'));
    }, timeoutMs);

    check();
  });
}

// Mở camera trực tiếp trên Android.
async function openAndroidCamera() {
  if (cameraStarting || androidCameraReady || busy) return;

  cameraStarting = true;
  $('shoot').disabled = true;
  setState('loading', 'Đang mở camera...');

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'Telegram không hỗ trợ mở camera trực tiếp. ' +
        'Hãy kiểm tra phiên bản Telegram và quyền camera.'
      );
    }

    androidStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' }
      },
      audio: false
    });

    const video = $('android-camera');
    video.srcObject = androidStream;

    $('stage').classList.add('android-camera-active');

    await video.play();
    await waitForVideo(video);

    androidCameraReady = true;
    cameraStarting = false;

    updateShootLabel();
    $('shoot').disabled = false;

    setState(
      'live',
      'Camera đã sẵn sàng. Nhìn vào camera rồi bấm Chụp ảnh.'
    );
  } catch (error) {
    stopAndroidCamera();
    $('shoot').disabled = false;

    setState(
      'live',
      '❌ Không mở được camera: ' + error.message +
      ' Hãy kiểm tra quyền camera của Telegram.'
    );
  }
}

// Chuẩn hóa ảnh thành JPEG để gửi lên webhook.
async function normalizeImage(dataUrl) {
  const image = await new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = () => {
      if (!img.naturalWidth || !img.naturalHeight) {
        reject(new Error('Ảnh không có kích thước hợp lệ.'));
      } else {
        resolve(img);
      }
    };

    img.onerror = () => {
      reject(new Error(
        'Không đọc được ảnh. Hãy chụp lại bằng camera.'
      ));
    };

    img.src = dataUrl;
  });

  const scale = Math.min(
    1,
    1024 / Math.max(image.naturalWidth, image.naturalHeight)
  );

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(
    1,
    Math.round(image.naturalWidth * scale)
  );
  canvas.height = Math.max(
    1,
    Math.round(image.naturalHeight * scale)
  );

  const context = canvas.getContext('2d');

  if (!context) {
    throw new Error('Không thể xử lý ảnh trên thiết bị này.');
  }

  context.drawImage(
    image,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const jpeg = canvas.toDataURL('image/jpeg', 0.8);

  if (
    !jpeg.startsWith('data:image/jpeg;base64,') ||
    jpeg.length < 1000
  ) {
    throw new Error('Ảnh không hợp lệ. Vui lòng chụp lại.');
  }

  return jpeg;
}

// Xử lý ảnh từ camera hệ thống trên iPhone.
$('attendance-camera').onchange = async event => {
  const file = event.target.files?.[0];

  // Người dùng hủy thao tác chụp.
  if (!file) return;

  try {
    if (!file.type.startsWith('image/') || file.size === 0) {
      throw new Error('Ảnh không hợp lệ. Vui lòng chụp lại.');
    }

    $('shoot').disabled = true;
    setState('loading', 'Đang xử lý ảnh...');

    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        if (
          typeof reader.result !== 'string' ||
          !reader.result.startsWith('data:image/')
        ) {
          reject(new Error('Không đọc được ảnh.'));
          return;
        }

        resolve(reader.result);
      };

      reader.onerror = () => {
        reject(new Error('Không đọc được ảnh. Vui lòng thử lại.'));
      };

      reader.readAsDataURL(file);
    });

    photo = await normalizeImage(dataUrl);

    $('img').src = photo;

    setState(
      'preview',
      `Kiểm tra ảnh rồi bấm gửi ${LABEL[type]}`
    );
  } catch (error) {
    photo = null;
    $('shoot').disabled = false;

    setState('live', '❌ ' + error.message);
  } finally {
    event.target.value = '';
  }
};

// Nút chụp ảnh.
$('shoot').onclick = async () => {
  if (busy || cameraStarting) return;

  if (!tg.initData) {
    setState(
      'error',
      'Hãy mở Mini App từ Telegram để chấm công.'
    );
    return;
  }

  // iPhone: giữ phương pháp camera hệ thống đã hoạt động.
  if (!isAndroid) {
    const input = $('attendance-camera');

    input.setAttribute('capture', 'user');
    input.value = '';
    input.click();

    return;
  }

  // Android: lần đầu mở camera.
  if (!androidCameraReady) {
    await openAndroidCamera();
    return;
  }

  // Android: lần tiếp theo chụp ảnh từ video.
  try {
    const video = $('android-camera');

    if (!video.videoWidth || !video.videoHeight) {
      throw new Error('Camera chưa có hình ảnh. Hãy thử lại.');
    }

    $('shoot').disabled = true;

    const scale = Math.min(
      1,
      1024 / Math.max(video.videoWidth, video.videoHeight)
    );

    const canvas = document.createElement('canvas');

    canvas.width = Math.max(
      1,
      Math.round(video.videoWidth * scale)
    );
    canvas.height = Math.max(
      1,
      Math.round(video.videoHeight * scale)
    );

    const context = canvas.getContext('2d');

    if (!context) {
      throw new Error('Không thể xử lý ảnh.');
    }

    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const captured = canvas.toDataURL('image/jpeg', 0.8);

    if (
      !captured.startsWith('data:image/jpeg;base64,') ||
      captured.length < 1000
    ) {
      throw new Error('Ảnh không hợp lệ. Vui lòng chụp lại.');
    }

    photo = captured;
    $('img').src = photo;

    stopAndroidCamera();

    setState(
      'preview',
      `Kiểm tra ảnh rồi bấm gửi ${LABEL[type]}`
    );
  } catch (error) {
    $('shoot').disabled = false;
    setState('live', '❌ ' + error.message);
  }
};

// Chụp lại.
$('retake').onclick = () => {
  if (busy) return;

  photo = null;
  $('img').removeAttribute('src');

  stopAndroidCamera();

  $('retake').disabled = false;
  $('send').disabled = false;

  showLive(
    isAndroid
      ? 'Nhấn Mở camera để chụp lại.'
      : 'Nhấn Chụp ảnh để chụp lại.'
  );
};

// Gửi ảnh đến n8n.
$('send').onclick = async () => {
  if (busy) return;

  if (
    !photo ||
    !photo.startsWith('data:image/jpeg;base64,') ||
    photo.length < 1000
  ) {
    setState('live', 'Vui lòng chụp ảnh hợp lệ trước khi gửi.');
    return;
  }

  busy = true;
  $('send').disabled = true;
  $('retake').disabled = true;

  setState('preview', 'Đang gửi dữ liệu chấm công...');

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        initData: tg.initData,
        image: photo,
        type: type
      })
    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(
        result.error || 'Gửi chấm công thất bại.'
      );
    }

    stopAndroidCamera();

    setState(
      'done',
      `✅ Đã ${LABEL[type]} lúc ${
        result.time ||
        new Date().toLocaleTimeString('vi-VN', {
          hour: '2-digit',
          minute: '2-digit',
          timeZone: 'Asia/Ho_Chi_Minh'
        })
      }`
    );

    setTimeout(() => tg.close(), 1500);
  } catch (error) {
    busy = false;

    $('send').disabled = false;
    $('retake').disabled = false;

    setState(
      'preview',
      '❌ Gửi thất bại: ' + error.message
    );
  }
};

// Không tự bật camera khi mở Mini App.
if (!tg.initData) {
  setState('error', 'Hãy mở Mini App từ Telegram để chấm công.');
} else {
  showLive(
    isAndroid
      ? 'Nhấn Mở camera để bắt đầu chấm công.'
      : 'Nhấn Chụp ảnh để bắt đầu chấm công.'
  );
}

// Dừng camera nếu Mini App bị đóng.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && androidStream) {
    stopAndroidCamera();
  }
});
</script>

</body>
</html>
```
